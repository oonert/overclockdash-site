<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OVERCLOCK: grab the truck</title>
<style>
  body { background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif; margin: 24px; }
  h1 { font-weight: normal; font-size: 18px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
  #truck { width: 560px; height: 420px; background: radial-gradient(ellipse at 50% 60%, #2a2f36, #0d0f12 70%); border-radius: 12px; cursor: grab; touch-action: none; position: relative; }
  #truck.grabbing { cursor: grabbing; }
  #readout { position: absolute; left: 12px; bottom: 10px; font: 13px ui-monospace, monospace; color: #9ecf6a; }
  #hint { position: absolute; left: 12px; top: 10px; color: #888; }
  button { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<h1>Grab the truck. The clock's TILT page follows. <a href="index.html" style="color:#9ecf6a;font-size:14px">&larr; back</a></h1>
<div class="row">
  <div id="truck"><div id="hint">drag up and down for pitch, left and right for roll</div><div id="readout"></div></div>
  <div id="clock"></div>
</div>
<p>
  <button onclick="setTilt(0, 0)">level</button>
  <button onclick="setTilt(12, 0)">nose up 12</button>
  <button onclick="setTilt(-8, 0)">nose down 8</button>
  <button onclick="setTilt(0, 10)">right side up 10</button>
  <button onclick="setTilt(0, -10)">left side up 10</button>
  <button onclick="clock && clock.click()">click the knob</button>
</p>
<script src="lib/three.min.js"></script>  <!-- three.js r128, MIT, lib/three-LICENSE -->
<script src="overclock.js"></script>
<script>
  // ── the clock ────────────────────────────────────────────────────────────
  let clock = null;
  OverclockClock.mount(document.getElementById('clock'), { frame: '4runner', frameWidth: 520, base: 'dist/', alerts: { storm: false } })
    .then(c => { clock = c; setTimeout(() => clock.goto('Level'), 14000); });   // after the splash, straight to TILT

  // ── the truck ────────────────────────────────────────────────────────────
  const box = document.getElementById('truck');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, box.clientWidth / box.clientHeight, 0.1, 100);
  camera.position.set(6.5, 4.2, 7.5); camera.lookAt(0, 0.6, 0);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(box.clientWidth, box.clientHeight);
  renderer.shadowMap.enabled = true;
  box.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xcfd8e6, 0x202428, 0.9));
  const sun = new THREE.DirectionalLight(0xfff2dc, 1.1); sun.position.set(5, 9, 4); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = sun.shadow.camera.bottom = -6; sun.shadow.camera.right = sun.shadow.camera.top = 6;
  scene.add(sun);

  // Ground: a tilting slab under the truck, so the truck sits on a slope rather than floating.
  const rig = new THREE.Group(); scene.add(rig);                 // tips with pitch and roll
  const slab = new THREE.Mesh(new THREE.BoxGeometry(7, 0.18, 4.4), new THREE.MeshStandardMaterial({ color: 0x5b5346, roughness: 1 }));
  slab.position.y = -0.09; slab.receiveShadow = true; rig.add(slab);
  const grid = new THREE.GridHelper(7, 14, 0x8a7f6a, 0x6e6555); grid.position.y = 0.001; rig.add(grid);

  // A low-poly truck: body, cab, bed rails, wheels, lights. No brand anything.
  const truck = new THREE.Group(); rig.add(truck);
  const paint = new THREE.MeshStandardMaterial({ color: 0xb8352a, roughness: 0.55, metalness: 0.15 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x22262b, roughness: 0.9 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x9fc6d9, roughness: 0.2, metalness: 0.4, transparent: true, opacity: 0.75 });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 1 });
  const rim = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.4, metalness: 0.7 });
  function part(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; (parent || truck).add(m); return m; }
  // +X is the nose.
  part(new THREE.BoxGeometry(4.2, 0.55, 1.9), dark, 0, 0.75, 0);                    // frame + sills
  part(new THREE.BoxGeometry(1.7, 0.75, 1.95), paint, 1.2, 1.35, 0);                // hood
  part(new THREE.BoxGeometry(2.0, 1.15, 1.95), paint, -0.9, 1.55, 0);               // cab and body
  part(new THREE.BoxGeometry(1.1, 0.7, 1.75), glass, -0.25, 1.85, 0);               // glass
  part(new THREE.BoxGeometry(0.5, 0.9, 1.95), paint, -1.95, 1.4, 0);                // tailgate
  part(new THREE.BoxGeometry(0.25, 0.1, 1.5), dark, -0.3, 2.18, 0);                 // roof rack
  part(new THREE.BoxGeometry(0.25, 0.1, 1.5), dark, -1.2, 2.18, 0);
  part(new THREE.BoxGeometry(0.15, 0.18, 0.35), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0xffe08a, emissiveIntensity: 0.6 }), 2.06, 1.3, 0.7);
  part(new THREE.BoxGeometry(0.15, 0.18, 0.35), new THREE.MeshStandardMaterial({ color: 0xfff1b0, emissive: 0xffe08a, emissiveIntensity: 0.6 }), 2.06, 1.3, -0.7);
  part(new THREE.BoxGeometry(0.12, 0.2, 0.3), new THREE.MeshStandardMaterial({ color: 0xff3b2e, emissive: 0xc01810, emissiveIntensity: 0.5 }), -2.21, 1.3, 0.7);
  part(new THREE.BoxGeometry(0.12, 0.2, 0.3), new THREE.MeshStandardMaterial({ color: 0xff3b2e, emissive: 0xc01810, emissiveIntensity: 0.5 }), -2.21, 1.3, -0.7);
  for (const [x, z] of [[1.35, 1.0], [1.35, -1.0], [-1.35, 1.0], [-1.35, -1.0]]) {
    const w = part(new THREE.CylinderGeometry(0.48, 0.48, 0.36, 24), rubber, x, 0.48, z); w.rotation.x = Math.PI / 2;
    const r = part(new THREE.CylinderGeometry(0.26, 0.26, 0.38, 12), rim, x, 0.48, z); r.rotation.x = Math.PI / 2;
  }

  // ── grab it ──────────────────────────────────────────────────────────────
  // Up and down = pitch (nose up when you pull the nose up), left and right =
  // roll (right side up when you lift the right side). Limits like a real slope.
  let pitch = 0, roll = 0, target = { pitch: 0, roll: 0 };
  const LIMIT = 35;
  function setTilt(p, r) { target.pitch = Math.max(-LIMIT, Math.min(LIMIT, p)); target.roll = Math.max(-LIMIT, Math.min(LIMIT, r)); }
  let drag = null;
  box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, p: target.pitch, r: target.roll }; box.classList.add('grabbing'); });
  box.addEventListener('pointermove', e => { if (!drag) return; setTilt(drag.p + (drag.y - e.clientY) * 0.25, drag.r + (e.clientX - drag.x) * 0.25); });
  const drop = () => { drag = null; box.classList.remove('grabbing'); };
  box.addEventListener('pointerup', drop); box.addEventListener('pointercancel', drop);
  box.addEventListener('wheel', e => { e.preventDefault(); setTilt(target.pitch - Math.sign(e.deltaY) * 2, target.roll); }, { passive: false });

  const readout = document.getElementById('readout');
  let lastSent = '';
  function frame() {
    requestAnimationFrame(frame);
    pitch += (target.pitch - pitch) * 0.15; roll += (target.roll - roll) * 0.15;   // the slab settles
    // Nose is +X: pitch (nose up) is a rotation about Z toward +Y, roll (right side up) a rotation about X.
    rig.rotation.set(-roll * Math.PI / 180, 0, pitch * Math.PI / 180);
    renderer.render(scene, camera);
    const key = pitch.toFixed(1) + ',' + roll.toFixed(1);
    if (key !== lastSent) { lastSent = key; if (clock) clock.tilt(pitch, roll); readout.textContent = 'pitch ' + (pitch >= 0 ? '+' : '') + pitch.toFixed(1) + '°  roll ' + (roll >= 0 ? '+' : '') + roll.toFixed(1) + '°'; }
  }
  frame();
</script>
</body>
</html>
